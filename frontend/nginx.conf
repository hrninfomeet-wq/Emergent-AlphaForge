server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Keep chart EventSources off the API origin's HTTP/1.1 connection pool.
  # Resolve the Compose service at request time so a backend recreation is safe.
  location ~ ^/api/charts/(streams|watchlist/stream|options/stream)$ {
    limit_except GET { deny all; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chart_backend http://backend:8001;
    proxy_pass $chart_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 2m;
    gzip off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
