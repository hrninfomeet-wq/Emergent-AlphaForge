services:
  mongo:
    image: mongo:7
    container_name: alphaforge_mongo
    restart: unless-stopped
    ports:
      # Loopback-only: credential-less Mongo must never be reachable from the LAN.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      # start_period + a short interval matter because backend gates on
      # `condition: service_healthy`. Without start_period Docker defers the
      # FIRST probe by a full interval, so a recreated Mongo (ready in ~1-2s)
      # still held the backend back for 15s.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        ALPHAFORGE_BUILD_REVISION: "${ALPHAFORGE_BUILD_REVISION:-}"
        ALPHAFORGE_BUILD_DIRTY: "${ALPHAFORGE_BUILD_DIRTY:-}"
    container_name: alphaforge_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: alphaforge
      CORS_ORIGINS: "http://localhost:3000"
      # Latency measurement harness. OFF unless explicitly set to 1.
      # Injects only into the reserved HARNESS| key namespace (see
      # backend/app/tick_replay.py) and never persists.
      ALPHAFORGE_TICK_REPLAY: "${ALPHAFORGE_TICK_REPLAY:-0}"
      # Flattrade MCP session auto-sync target (host ~/.flattrade bind below).
      # Machine-specific by design — this compose file is single-machine.
      FLATTRADE_MCP_SESSION_DIR: /host-flattrade
    ports:
      # Loopback-only: the API has no authentication layer; keep it off the LAN.
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend/app/strategies/plugins:/app/app/strategies/plugins
      - C:/Users/haroo/.flattrade:/host-flattrade

  conditional-watchdog:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: alphaforge_conditional_watchdog
    restart: unless-stopped
    command: ["python", "-m", "app.conditional.watchdog"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: alphaforge
      CONDITIONAL_BACKEND_URL: http://backend:8001
    depends_on:
      mongo:
        condition: service_healthy
    # This worker intentionally serves no HTTP listener.
    healthcheck:
      disable: true

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
        ALPHAFORGE_BUILD_REVISION: "${ALPHAFORGE_BUILD_REVISION:-}"
        ALPHAFORGE_BUILD_DIRTY: "${ALPHAFORGE_BUILD_DIRTY:-}"
    container_name: alphaforge_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001

volumes:
  mongo_data:
    driver: local
